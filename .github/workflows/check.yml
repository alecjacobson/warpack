name: Package and lint
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install build ruff 'warp-lang>=1.15'
      - run: ruff check warpack tests benchmarks examples
      - run: python scripts/generate_api_docs.py --check
      - run: python -m build
      # Numerical tests require a CUDA GPU; see results/validation.json.
